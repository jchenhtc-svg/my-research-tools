name: 部署週會宣導入口網站到 GitHub Pages

on:
  push:
    branches:
      - claude/modest-dijkstra-hikm1d
    paths:
      - "tools/週會宣導/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "tools/週會宣導"
      - id: deployment
        uses: actions/deploy-pages@v4
